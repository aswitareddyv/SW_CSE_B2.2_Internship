<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html table 5</title>
</head>
<body>
    <!--spanning rows and columns-->
    <table border="2">
        <th colspan="3">student details</th>
            <tr>
                <td colspan="2"> name</td>
            </tr>
            <tr>
                <td>aswita</td>
            </tr>
            <tr>
                <td>courses</td>
                <td>full stack</td>
                <td>gen ai</td>
            </tr>
        
    </table>
    <!--rowspan-->
    <table border="2">
        <tr>
            <th rowspan="2">day</th>
            <th>morning</th>
            <th>evening</th>
        </tr>
        <tr>
            <th rowspan="2">reactjs practice</th>
            <th>backend practice</th>
        </tr>

    </table>
</body>
</html>
