<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform |Translate |rotate</title>
    <style>
        .box{
            transform: translateX(50px) rotate(3deg) ;
            background-color: rgb(231, 149, 41);
            border: 2px solid black;
        }
        .box1{
            transform: translateY(20px) ;
            background-color: rgb(73, 38, 233);
            border: 2px solid black;
        }
        .box2{
            transform: translate(0px 50px) ;
            background-color: rgb(42, 193, 110);
            border: 2px solid black;
        }
        .box3{
            transform: rotateZ(180deg) ;
            background-color: rgb(193, 145, 42);
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <p>CSS Transform: property visually moves,rotate ,enlarge, shrink. It 2d or 3d</p>
    <!--Syntax-->
     transform: transform-function(value)
     <div class="box">
        Hello, we are learning CSS Transform
     </div>
     <div class="box2">
        Hello, we are learning CSS Transform
     </div>
     <div class="box1">
        Hello, we are learning CSS Transform
     </div>
     <div class="box3">
        box3
     </div>
     <!--translate, translateY, translateX| rotate(+/_) rotateX-->
</body>
</html>
