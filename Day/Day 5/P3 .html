<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS colors</title>
    <style>
        .named{
           color: blue;
        }
        .HEX{
            /*0-f red green blue*/
            color: #ff0023;
        }
        .RGB{
            color: rgba(130, 58 ,196 , 1);
        }
        .HSL{
            /*hsl :hue(0-360| 0 -red, 120-green,240-ble), saturation (0-100%) vivid,lightness (0-100%) light/dark, transparency(0-1)*/

            color: hsl(128, 100%, 50%,1);
        }
        .gradient{
            /*linear|radial|conic*/
            background-image:linear-gradient (135deg,red,blue);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            display: inline block;
        }
    </style>
</head>
<body>
    <p>CSS Colors</p>
    <ol>
        <li class="named">Named colors</li>
        <li class="HEX">HEX colors</li>
        <li class="RGB">RGB &RGBA</li>
        <li class="HSL">HSL &HSLA</li>
        <li class="gradient">Gradient color</li>
    </ol>
</body>
</html>
