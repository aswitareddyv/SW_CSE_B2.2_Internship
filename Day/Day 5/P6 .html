<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox |display |flex direction |justify-content </title>
    <style>
        .container{
            display: flex;
            border: 2px solid blue;
            gap: 10px;
            padding: 10px;
            flex-direction: column;
        }
        .item{
            background-color: blue;
            color: crimson;
            padding: 15px;
            text-align: center;
            justify-content: center;
    
        }
       .container2{
            display: flex;
            border: 2px solid red;
            gap: 10px;
            padding: 10px;
            margin-top: 20px;
            flex-direction:row;
        }
        .item2{
            background-color: red;
            color: crimson;
            padding: 15px;
            text-align: center;
            justify-content:center;
        } 
         .container3{
            display: flex;
            border: 2px solid red;
            gap: 10px;
            padding: 10px;
            margin-top: 20px;
        justify-content: space-evenly;
        }
        .item3{
            background-color: chartreuse;
            color: crimson;
            padding: 15px;
            flex-direction:row;
            margin-top: 10px;
        } 
    </style>
</head>
<body>
    <p>CSS Flexbox: ia a one-dimensional layout system designed to arrange and allign items in a container
        either in a row or a column. It makes much easier to create responsive, flexible layouts
        without complex positioning or floats.
    </p>
    <div class="container">
         <div class="item">Item 1</div>
         <div class="item">Item 2</div>
         <div class="item">Item 3</div>
    </div>
    <!--flex direction-->
    <div class="container 2">
         <div class="item2">Item 1</div>
         <div class="item2">Item 2</div>
         <div class="item2">Item 3</div>
    </div>
    <!--justify content-->
     <div class="container 3">
         <div class="item3">Item 1</div>
         <div class="item3">Item 2</div>
         <div class="item3">Item 3</div>
    </div>
</body>
</html>
