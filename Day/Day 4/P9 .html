<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors |Type Selector/element selector</title>
    <style>
        .style1{
            font-size: 18px;
            background-color: cadetblue;
            color: blanchedalmond;
        }
        .style2{
             color: brown;
        }
        .style3{
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 class="style1">Class selector </h1>
    <h1 class="style2">Heading tag itself:but different style</h1>
    <p class="style3">This is a new paragraph that I have created</p>
    <p class="style2">this is a second paragraph</p>
</body>
</html>
