<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: blueviolet;
            color: brown;
        }
        section{
            padding: 20px;
            margin-bottom: 10px;
        }
        .h2{
            margin-bottom: 20px;
        }
        .box{
            background-color: cadetblue;
            padding: 20px;
            text-align: center;
            border-radius: 4px;
        }
        .basic-grid{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(2,120px);
            gap: 12px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <p>CSS Grid: two-dimensional layout system. We can design layouts using rows and columns together.</p>
    <section>
        <h2>1.Basic Grid(columns,rows,repeat,fr</h2>
        <div class="basic-grid">   
          <div class="box">1</div>
          <div class="box">2</div>
          <div class="box">3</div>
          <div class="box">4</div>
          <div class="box">5</div>
          <div class="box">6</div>
        </div>
    </section>
</body>
</html>
