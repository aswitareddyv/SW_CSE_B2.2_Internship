<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with attributes</title>
</head>
<body>
    <img src="SW_CSE_B2.2_Internship/Day/Day 2/dog.jpg" alt="">
    <!--getAttributes & set Attributes-->
    <input type="text" disabled>
    <script>
        const img = document.querySelector("img");
        const src = img.getAttribute("src");
        img.setAttribute("alt","Image of an animal");
        img.setAttribute("src","https://plus.unsplash.com/premium_photo-1661847643150-4e06569d2ec1?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8dGlnZXJ8ZW58MHx8MHx8fDA%3D")
        const input = document.querySelector("Input");
        console.log(input.hasAttribute("disabled"));
        input.removeAttribute("disabled");

        </script>
</body>
</html>
